services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: fmkj-v3:latest
    container_name: fmkj-v3
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
    ports:
      - "3000:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
